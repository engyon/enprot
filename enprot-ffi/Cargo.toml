[package]
name = "enprot-ffi"
version = "0.5.37"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
description = "C FFI for enprot — shared library (libenprot) for Python, Node.js, Go, Ruby bindings"
repository = "https://github.com/engyon/enprot"
homepage = "https://github.com/engyon/enprot"
keywords = ["encryption", "engyon", "ept", "ffi", "bindings"]
categories = ["cryptography", "api-bindings"]

[lib]
name = "enprot"
# cdylib + staticlib: FFI consumers (Python/Node/Go/Ruby) link
# against the shared/static artifact named `libenprot.{so,dylib,dll}`.
# We deliberately DON'T add rlib here — the main enprot crate also
# produces a libenprot.rlib, and Cargo cannot disambiguate two
# candidates with the same name. Integration tests use `extern "C"`
# declarations + #[link(name = "enprot")] to consume the cdylib.
crate-type = ["cdylib", "staticlib"]

[dependencies]
enprot = { path = "..", version = "0.5.39", default-features = false }
serde_json = "1"

[features]
default = ["cli"]
cli = ["enprot/cli"]
vendored-rnp = ["enprot/vendored-rnp"]
