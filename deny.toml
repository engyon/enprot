# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    # webpki-roots / webpki-root-certs (Mozilla CA bundle data),
    # pulled by the cas-s3 feature's rustls transport. Permissive
    # data license, standard accompaniment of the rustls ecosystem.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl", use-instead = "rustls" },
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unknown-git = "deny"

[output]
feature-depth = 1
