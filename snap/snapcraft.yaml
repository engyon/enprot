name: enprot
# core24 (Ubuntu 24.04). libbotan-3-dev is not in standard repos for
# any Ubuntu release, so we download the prebuilt musl static binary
# from the GitHub Release for the same tag.
base: core24
version: 'RELEASE_TAG'
summary: Enprot is a confidentiality processor for text and source code files.
license: 'BSD-2-Clause'
description: |
  Engyon Protected Text (EPT) is a human-editable annotation method that
  allows a text format document to contain finely grained cryptographic
  confidentiality and integrity features.

grade: stable
confinement: strict

parts:
  enprot:
    plugin: nil
    source: .
    override-build: |
      set -eux
      # CRAFT_PROJECT_VERSION is set by snapcraft from the version: field
      # above. The deploy.yml sed already replaced RELEASE_TAG with the
      # actual version (e.g., 0.5.3).
      VER="$CRAFT_PROJECT_VERSION"
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      # Download the musl static binary from the GitHub Release for
      # this tag. The release must already exist (publish-snap has
      # needs: [github-release]).
      curl -fsSL \
        "https://github.com/engyon/enprot/releases/download/v${VER}/enprot-${VER}-x86_64-unknown-linux-musl.tar.gz" \
        -o /tmp/enprot.tar.gz
      # Extract the binary from the archive.
      tar -xzf /tmp/enprot.tar.gz -C /tmp
      cp /tmp/enprot "$CRAFT_PART_INSTALL/bin/enprot"
      chmod +x "$CRAFT_PART_INSTALL/bin/enprot"

apps:
  enprot:
    command: bin/enprot
