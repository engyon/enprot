name: enprot
# core24 (Ubuntu 24.04). libbotan-3-dev is not in standard repos for
# any Ubuntu release, so we download the prebuilt musl static binary
# from the GitHub Release for the same tag.
base: core24
version: 'RELEASE_TAG'
summary: Enprot is a confidentiality processor for text and source code files.
license: 'BSD-2-Clause'
description: |
  Engyon Protected Text (EPT) is a human-editable annotation method that
  allows a text format document to contain finely grained cryptographic
  confidentiality and integrity features.

grade: stable
confinement: strict

parts:
  enprot:
    plugin: nil
    source: .
    override-build: |
      set -eu
      # 'pipefail' is intentionally OFF — we want curl's non-zero
      # exit on a 404 to be caught by the if/then, not abort the
      # script before we can try the next tag prefix.
      VER="$CRAFT_PROJECT_VERSION"
      mkdir -p "$CRAFT_PART_INSTALL/bin"

      ASSET_NAME="enprot-${VER}-x86_64-unknown-linux-musl.tar.gz"

      # Download the release asset DIRECTLY, not via the API: the
      # API is unauthenticated from the snapcraft VM (shared runner
      # IPs exhaust the 60/hr limit — the 2026-08-29 snap run resolved
      # an empty ASSET_URL with the asset sitting on the release), and
      # release downloads are served off the API host entirely.
      # Deterministic URL, try the post-split tag (`enprot-vX.Y.Z`)
      # first, then the legacy tag (`vX.Y.Z`) for releases older than
      # the FFI split; a 404 on both fails loudly below.
      URL=""
      for prefix in "enprot-v" "v"; do
        TAG="${prefix}${VER}"
        ASSET_URL="https://github.com/engyon/enprot/releases/download/${TAG}/${ASSET_NAME}"
        echo "Trying release download: $ASSET_URL"
        if curl -fsSL --retry 3 -o /tmp/enprot.tar.gz "$ASSET_URL"; then
          URL="$ASSET_URL"
          echo "Found asset on tag $TAG"
          break
        fi
      done

      if [ -z "$URL" ]; then
        echo "ERROR: no GitHub Release artifact '$ASSET_NAME' found for version ${VER}" >&2
        echo "Tried tags: enprot-v${VER}, v${VER}" >&2
        exit 1
      fi

      tar -xzf /tmp/enprot.tar.gz -C /tmp
      cp /tmp/enprot "$CRAFT_PART_INSTALL/bin/enprot"
      chmod +x "$CRAFT_PART_INSTALL/bin/enprot"

apps:
  enprot:
    command: bin/enprot
