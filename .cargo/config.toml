# Reproducible-build link flags (TODO.completion/12).
# Canonical path remapping so debug info doesn't carry build-env-
# specific paths like /home/runner/work/... The leading slash
# matches absolute paths; the replacement `/cargo` is a stable
# placeholder.
[build]
rustflags = ["--remap-path-prefix=/usr/local/cargo=/cargo"]

# Windows MSVC linker workaround for LNK1201.
#
# During parallel codegen, multiple link.exe invocations can race on
# the same final .pdb (Windows Defender real-time scanning also
# locks the file mid-write); the vendored C stack makes the release
# PDB large enough that the write also fails on runner disk space.
# Release binaries ship stripped, so emit no debug info at all:
# `-C debuginfo=0` stops rustc generating PDB-referencing objects
# and `/DEBUG:NONE` stops link.exe writing one. (/DEBUG:FASTLINK
# was tried first and still died on release\deps\enprot.pdb.)
#
# Symptom: `LINK : fatal error LNK1201: error writing to program
# database 'target\release\deps\enprot.pdb'`.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "debuginfo=0", "-C", "link-arg=/DEBUG:NONE"]
