[package]
name = "enprot-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone crate, not a workspace member (cargo-fuzz template
# convention): cargo fuzz manages its own build, and workspace
# inheritance would pull in the main crate's target dir.
[workspace]

[features]
# Mirrors the root crate's vendored-rnp: CI fuzzes with librnp
# built from source (no system librnp on the runners); local runs
# against brew librnp just omit the feature.
vendored-rnp = ["enprot/vendored-rnp"]

[dependencies]
libfuzzer-sys = "0.4"
enprot = { path = ".." }
tempfile = "3"

[[bin]]
name = "parse_no_panic"
path = "fuzz_targets/parse_no_panic.rs"
test = false
doc = false

[[bin]]
name = "conflict_well_formed"
path = "fuzz_targets/conflict_well_formed.rs"
test = false
doc = false

[[bin]]
name = "parse_extfields"
path = "fuzz_targets/parse_extfields.rs"
test = false
doc = false

[[bin]]
name = "merge_driver"
path = "fuzz_targets/merge_driver.rs"
test = false
doc = false

[[bin]]
name = "cas_hash_validation"
path = "fuzz_targets/cas_hash_validation.rs"
test = false
doc = false

[[bin]]
name = "separator_round_trip"
path = "fuzz_targets/separator_round_trip.rs"
test = false
doc = false
