[package]
name        = "enprot"
version     = "0.3.1"
authors     = ["Ribose Inc. <open.source@ribose.com>"]
license     = "BSD-2-Clause"
description = "enprot command line tool for Engyon"
repository  = "https://github.com/engyon/enprot"
homepage    = "https://github.com/engyon/enprot"
documentation = "https://github.com/engyon/enprot/blob/main/README.adoc"
readme      = "README.adoc"
categories  = ["command-line-utilities", "cryptography"]
keywords    = ["encryption", "engyon", "ept", "botan"]
edition     = "2024"
rust-version = "1.85"
autotests   = false

[[bin]]
name = "enprot"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/tests.rs"

[dependencies]
hex            = "0.4"
rpassword      = "7"
clap           = { version = "4.5", features = ["derive", "wrap_help"] }
botan          = { version = "0.11", features = ["botan3", "pkg-config"] }
phf            = { version = "0.11", features = ["macros"] }
thiserror      = "2"
# Botan does not implement AES-GCM-SIV (RFC 8452). The RustCrypto crate
# remains the backend for `aes-256-gcm-siv`; the other ciphers route through
# Botan.
aes-gcm-siv    = "0.11"

[dev-dependencies]
tempfile    = "3"
assert_cmd  = "2"
predicates  = "3"
cpu-time    = "1.0"
proptest    = "1"

[[test]]
name = "proptest_roundtrip"
path = "tests/proptest_roundtrip.rs"
